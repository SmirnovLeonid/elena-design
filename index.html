<style>

.scr{border-radius:36px;overflow:hidden;position:relative;background:#fff}
.scr iframe{position:absolute;left:0;top:0;border:0;background:#fff}
.mbtn{display:none}

  .sp{display:none}.brand{flex:1}
  .seg{display:none;order:3;width:100%;justify-content:space-between}.seg button{flex:1;justify-content:center;text-align:center;padding:9px 6px;font-size:12px}
  .tabs{display:none;padding:8px 14px 0;grid-template-columns:1fr;gap:6px}.tab{padding:11px 14px}.tab p{display:none}
  body.menu-open .seg{display:flex}body.menu-open .tabs{display:grid}
  .stage{padding:10px 10px 6px}
}
</style>
</head>

0%B2%D1%83%D0%B9%D1%82%D0%B5%2C%20%D0%95%D0%BB%D0%B5%D0%BD%D0%B0%21%20%D0%A5%D0%BE%D1%87%D1%83%20%D1%81%D0%B4%D0%B5%D0%BB%D0%B0%D1%82%D1%8C%20%D0%BA%D0%BB%D0%B0%D1%81%D1%81%D0%BD%D1%8B%D0%B9%20%D0%BF%D1%80%D0%B0%D0%B7%D0%B4%D0%BD%D0%B8%D0%BA%21\" data-wa=\"Здравствуйте, Елена! Хочу сделать классный праздник!\" target=\"_blank\" rel=\"noopener\">Обсудить праздник<\/a><a class=\"tl2\" href=\"#ch-prog\">Смотреть программы<\/a><\/div>\n  <div class=\"pills\"><div><b>1000+<\/b>мероприятий<\/div><div><b>20+<\/b>готовых образов<\/div><\/div>\n<\/div><\/section>\n\n<section class=\"st c\" id=\"ch-about\"><div class=\"wrap\">\n  <div class=\"kk\">Обо мне<\/div>\n  <p class=\"rv\">У меня профессиональное образование, и я знаю, о чём говорю: окончила театральное училище и стала дипломированным специалистом — <em>режиссёр театрализованных представлений и праздников (СПбГУКИ)<\/em>.<\/p>\n<\/div><\/section>\n\n<section class=\"fmt bl\"><div class=\"wrap\">\n  <div class=\"hd c rv\"><div class=\"kk\">Форматы<\/div><h2>Для любого <em>события<\/em><\/h2><\/div>\n  <div class=\"fcards rv\">\n    <div><i>I<\/i><span>Ведущая на любой праздник<\/span><\/div>\n    <div><i>II<\/i><span>Актриса с театрализованной программой<\/span><\/div>\n    <div><i>III<\/i><span>Тематические розыгрыши и перфомансы<\/span><\/div>\n    <div><i>IV<\/i><span>Экспресс-поздравления близким и друзьям<\/span><\/div>\n    <div><i>V<\/i><span>Яркий welcome с необычными фото для соцсетей<\/span><\/div>\n    <div><i>VI<\/i><span>Календарные праздники, мальчишники и девичники, свадьбы и корпоративы<\/span><\/div>\n  <\/div>\n<\/div><\/section>\n\n<section class=\"prog\" id=\"ch-prog\"><div class=\"wrap\">\n  <div class=\"hd rv\"><div class=\"kk\">Программы<\/div><h2>Какие образы чаще всего <em>выбирают?<\/em><\/h2><\/div>\n  <div class=\"tabs\" data-tabs>\n    <div class=\"tlist\" role=\"tablist\">\n      <button type=\"button\" data-tab=\"0\" class=\"on\"><i>01<\/i>Пионерская вечеринка<\/button>\n      <button type=\"button\" data-tab=\"1\"><i>02<\/i>Аля Русь<\/button>\n      <button type=\"button\" data-tab=\"2\"><i>03<\/i>Вечеринка в стиле 90-х<\/button>\n      <button type=\"button\" data-tab=\"3\"><i>04<\/i>Тётя Зина<\/button>\n      <button type=\"button\" data-tab=\"4\"><i>05<\/i>Потомственная ведунья<\/button>\n    <\/div>\n    <div class=\"panels\">\n      <div class=\"tp on\" data-panel=\"0\"><div class=\"im\" data-show=\"pioneers\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3033-6534-4537-a366-393963323037/-/resize/700x/IMG_5657.JPG\" data-full=\"https://static.tildacdn.info/tild3033-6534-4537-a366-393963323037/-/resize/1600x/IMG_5657.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3264-3636-4132-b162-333536323861/-/resize/700x/IMG_5660.JPG\" data-full=\"https://static.tildacdn.info/tild3264-3636-4132-b162-333536323861/-/resize/1600x/IMG_5660.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3331-3463-4261-b832-643833373234/-/resize/700x/IMG_5658.JPG\" data-full=\"https://static.tildacdn.info/tild3331-3463-4261-b832-643833373234/-/resize/1600x/IMG_5658.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3363-6366-4565-a439-626664373736/-/resize/700x/photo_52896730807356.jpg\" data-full=\"https://static.tildacdn.info/tild3363-6366-4565-a439-626664373736/-/resize/1600x/photo_52896730807356.jpg\"><\/div><div class=\"tx\"><div class=\"k\">Пионеры<\/div><h3>Пионерская <em>вечеринка<\/em><\/h3>\n        <div class=\"q\">«Ни шагу назад, ни шагу на месте, а только вперёд, и только всем вместе!»<\/div>\n        <p>К танцам, песням и веселью будь готов — всегда готов! Если вы относите себя к числу незаурядных личностей, любите нестандартные решения и настоящее веселье — «Пионерская вечеринка» произведёт неизгладимое впечатление на гостей и надолго останется в вашей памяти.<\/p>\n        <a class=\"btn\" href=\"https://wa.me/79052258710?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%2C%20%D0%95%D0%BB%D0%B5%D0%BD%D0%B0%21%20%D0%A5%D0%BE%D1%87%D1%83%20%D0%BF%D1%80%D0%BE%D0%B3%D1%80%D0%B0%D0%BC%D0%BC%D1%83%20%C2%AB%D0%9F%D0%B8%D0%BE%D0%BD%D0%B5%D1%80%D1%81%D0%BA%D0%B0%D1%8F%20%D0%B2%D0%B5%D1%87%D0%B5%D1%80%D0%B8%D0%BD%D0%BA%D0%B0%C2%BB.\" data-wa=\"Здравствуйте, Елена! Хочу программу «Пионерская вечеринка».\" target=\"_blank\" rel=\"noopener\">Хочу такую программу<\/a><\/div><\/div>\n      <div class=\"tp\" data-panel=\"1\"><div class=\"im\" data-show=\"alyarus\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3134-3165-4331-b265-636162616133/-/resize/700x/5208791794215675604.jpg\" data-full=\"https://static.tildacdn.info/tild3134-3165-4331-b265-636162616133/-/resize/1600x/5208791794215675604.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3263-6531-4133-a231-333838643839/-/resize/700x/IMG_5671.JPG\" data-full=\"https://static.tildacdn.info/tild3263-6531-4133-a231-333838643839/-/resize/1600x/IMG_5671.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3265-3032-4264-a530-343032393537/-/resize/700x/IMG_5664.JPG\" data-full=\"https://static.tildacdn.info/tild3265-3032-4264-a530-343032393537/-/resize/1600x/IMG_5664.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3664-3533-4136-b932-643730633338/-/resize/700x/5208791794215674606.jpg\" data-full=\"https://static.tildacdn.info/tild3664-3533-4136-b932-643730633338/-/resize/1600x/5208791794215674606.jpg\"><\/div><div class=\"tx\"><div class=\"k\">Фольклор<\/div><h3><em>Аля<\/em> Русь<\/h3>\n        <p>Праздничная программа, которая обыграет популярные мотивы и клише русского фольклора. Ловко жонглирую скалкой и микрофоном, поём песни и танцуем под живой баян.<\/p>\n        <a class=\"btn\" href=\"https://wa.me/79052258710?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%2C%20%D0%95%D0%BB%D0%B5%D0%BD%D0%B0%21%20%D0%A5%D0%BE%D1%87%D1%83%20%D0%BF%D1%80%D0%BE%D0%B3%D1%80%D0%B0%D0%BC%D0%BC%D1%83%20%C2%AB%D0%90%D0%BB%D1%8F%20%D0%A0%D1%83%D1%81%D1%8C%C2%BB.\" data-wa=\"Здравствуйте, Елена! Хочу программу «Аля Русь».\" target=\"_blank\" rel=\"noopener\">Хочу такую программу<\/a><\/div><\/div>\n      <div class=\"tp\" data-panel=\"2\"><div class=\"im\" data-show=\"nineties\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3162-3130-4233-a536-326332393965/-/resize/700x/photo_52896730807356.jpg\" data-full=\"https://static.tildacdn.info/tild3162-3130-4233-a536-326332393965/-/resize/1600x/photo_52896730807356.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3230-6332-4365-b464-623666303739/-/resize/700x/IMG_5614.JPG\" data-full=\"https://static.tildacdn.info/tild3230-6332-4365-b464-623666303739/-/resize/1600x/IMG_5614.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3266-6136-4734-b534-306262646333/-/resize/700x/IMG_5609.JPG\" data-full=\"https://static.tildacdn.info/tild3266-6136-4734-b534-306262646333/-/resize/1600x/IMG_5609.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3965-3762-4061-a635-356336646134/-/resize/700x/IMG_5618.JPG\" data-full=\"https://static.tildacdn.info/tild3965-3762-4061-a635-356336646134/-/resize/1600x/IMG_5618.JPG\"><\/div><div class=\"tx\"><div class=\"k\">Корпоратив<\/div><h3>Вечеринка в стиле <em>90-х<\/em><\/h3>\n        <p>Мероприятие, на котором можно погрузиться в атмосферу свободы, евродэнса и лосин, отдохнуть, вспомнить прошлые года и просто невероятно провести время. Тематические песни, танцы, конкурсы и другие части программы помогут словно на машине времени вернуться в 90-е.<\/p>\n        <a class=\"btn\" href=\"https://wa.me/79052258710?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%2C%20%D0%95%D0%BB%D0%B5%D0%BD%D0%B0%21%20%D0%A5%D0%BE%D1%87%D1%83%20%D0%BA%D0%BE%D1%80%D0%BF%D0%BE%D1%80%D0%B0%D1%82%D0%B8%D0%B2%20%D0%B2%20%D1%81%D1%82%D0%B8 обы к нам пришла Тётя Зина.\" target=\"_blank\" rel=\"noopener\">Хочу такую программу<\/a><\/div><\/div>\n      <div class=\"tp\" data-panel=\"4\"><div class=\"im\" data-show=\"veduna\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3530-3038-4638-b663-353834366363/-/resize/700x/5208791794215674458.jpg\" data-full=\"https://static.tildacdn.info/tild3530-3038-4638-b663-353834366363/-/resize/1600x/5208791794215674458.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3539-3438-4363-b831-326132373239/-/resize/700x/5208791794215674246.jpg\" data-full=\"https://static.tildacdn.info/tild3539-3438-4363-b831-326132373239/-/resize/1600x/5208791794215674246.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild6236-3031-4665-b162-626538363833/-/resize/700x/5208791794215675838.jpg\" data-full=\"https://static.tildacdn.info/tild6236-3031-4665-b162-626538363833/-/resize/1600x/5208791794215675838.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild6337-6439-4361-a139-623061353639/-/resize/700x/5208791794215674585.jpg\" data-full=\"https://static.tildacdn.info/tild6337-6439-4361-a139-623061353639/-/resize/1600x/5208791794215674585.jpg\"><\/div><div class=\"tx\"><div class=\"k\">Юмор<\/div><h3>Потомственная <em>ведунья<\/em><\/h3>\n        <p>Интерактивная юмористическая программа, подходящая для любого события. Снимаю порчу, возвращаю денежный поток, соединяю судьбы, ставлю защиты на все 7 поколений.<\/p>\n        <a class=\"btn\" href=\"https://wa.me/79052258710?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%2C%20%D0%95%D0%BB%D0%B5%D0%BD%D0%B0%21%20%D0%A5%D0%BE%D1%87%D1%83%20%D0%BF%D1%80%D0%BE%D0%B3%D1%80%D0%B0%D0%BC%D0%BC%D1%83%20%C2%AB%D0%9F%D0%BE%D1%82%D0%BE%D0%BC%D1%81%D1%82%D0%B2%D0%B5%D0%BD%D0%BD%D0%B0%D1%8F%20%D0%B2%D0%B5%D0%B4%D1%83%D0%BD%D1%8C%D1%8F%C2%BB.\" data-wa=\"Здравствуйте, Елена! Хочу программу «Потомственная ведунья».\" target=\"_blank\" /li><\/ul><\/div><\/div>\n    <div class=\"fs rv\"><div class=\"n\">II<\/div><div><h3>Выбор образа<\/h3><ul><li>более 20 готовых образов<\/li><li>создание образа под ваш запрос<\/li><li>приглашение дополнительных артистов<\/li><\/ul><\/div><\/div>\n    <div class=\"fs rv\"><div class=\"n\">III<\/div><div><h3>Встреча с заказчиком<\/h3><p>Если вы хотите обсудить сценарий или концепцию моего выхода, мы можем созвониться или встретиться лично.<\/p><\/div><\/div>\n    <div class=\"fs rv\"><div class=\"n\">IV<\/div><div><h3>Внесение предоплаты<\/h3><p>Для бронирования даты и времени.<\/p><\/div><\/div>\n    <div class=\"fs rv\"><div class=\"n\">V<\/div><div><h3>Остаток оплаты<\/h3><p>После оплаты я буду рада услышать или прочитать отзыв.<\/p><\/div><\/div>\n    <div class=\"fs rv\"><div class=\"n\">VI<\/div><div><h3>Праздник<\/h3><p>Веселимся до упаду или культурно проводим время в отличной компании!<\/p><\/div><\/div>\n  <\/div>\n<\/div><\/section>\n\n<section class=\"clients\"><div class=\"wrap\">\n  <div class=\"hd c rv\"><div class=\"kk\">С кем я работала<\/div><h2>Меня <em>выбирают<\/em><\/h2><\/div>\n  <div class=\"cl rv\" data-clients><span>Совкомбанк<\/span><span>Ginza Project<\/span><span>Руки Вверх<\/span><span>Парк «Диво Остров»<\/span><span>Клуб 154<\/span><span>Сеть ресторанов Unity<\/span><span>Небар<\/span><span>Stroganoff Group<\/span><span>Русская Рюмочная № 1<\/span><span>Santa Barbara<\/span><span>Театр оперы и балета<\/span><span>Летний дворец<\/span><\/div>\n  <div class=\"facts rv\">\n    <div><b>Event-театр<\/b>Действующая артистка Event-театра. Гастролирую по городам и странам: Москва, Сочи, Турция, Баку.<\/div>\n    <div><b>Постоянный резидент<\/b>Stroganoff Group и Русской Рюмочной № 1.<\/div>\n    <div><b>Лучшие площадки Петербурга<\/b>Ежегодно провожу мероприятия в Летнем дворце. Работала в Санкт-Петербургском государственном театре оперы и балета.<\/div>\n  <\/div>\n<\/div><\/section>\n\n<section class=\"rev sd\" id=\"ch-rev\">\n  <div class=\ образы<\/a><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"scrollcue\">Листайте<\/div>\n<\/section>\n\n<section class=\"statement\" id=\"cx-about\"><div class=\"wrap\">\n  <div class=\"eyebrow\">Обо мне<\/div>\n  <p class=\"big\" id=\"cx-big\">Живу <em>праздником<\/em> уже 20 лет. У меня профессиональное образование, и я знаю, о чём говорю: окончила театральное училище и стала дипломированным специалистом — режиссёр театрализованных представлений и праздников (СПбГУКИ).<\/p>\n<\/div><\/section>\n\n<section class=\"services\"><div class=\"wrap\">\n  <ul class=\"svc\">\n    <li class=\"rv\"><i>01<\/i>Ведущая на любой праздник<\/li>\n    <li class=\"rv\"><i>02<\/i>Актриса с театрализованной программой<\/li>\n    <li class=\"rv\"><i>03<\/i>Тематические розыгрыши и перфомансы<\/li>\n    <li class=\"rv\"><i>04<\/i>Экспресс-поздравления близким и друзьям<\/li>\n    <li class=\"rv\"><i>05<\/i>Яркий welcome, где сделаем необычные фото для ваших соцсетей<\/li>\n    <li class=\"rv\"><i>06<\/i>Календарные праздники, мальчишники и девичники, свадьбы и корпоративы<\/li>\n  <\/ul>\n<\/div><\/section>\n\n<section class=\"stats\"><div class=\"wrap\">\n  <div class=\"stat rv\"><b><span data-count=\"15\">15<\/span><sup>+<\/sup><\/b><p>лет в сфере создания праздников<\/p><\/div>\n  <div class=\"stat rv\"><b><span data-count=\"1000\">1000<\/span><sup>+<\/sup><\/b><p>реализованных проектов с оригинальной концепцией<\/p><\/div>\n  <div class=\"stat t rv\"><b>Настоящее шоу<\/b><p>Незабываемые впечатления для каждого гостя от настоящих артистов на празднике любого формата.<\/p><\/div>\n<\/div><\/section>\n\n<section class=\"prog\"><div class=\"wrap\">\n  <div class=\"hd rv\"><div class=\"eyebrow\">Программы<\/div><h2>Какие образы чаще всего <em>выбирают?<\/em><\/h2><\/div>\n\n  <article class=\"pcard\"><div class=\"txt\"><div><div class=\"no\">№ 1<span>Пионеры<\/span><\/div><h3>Пионерская <em>вечеринка<\/em><\/h3>\n    <div class=\"q\">«Ни шагу назад, ни шагу на месте, а только вперёд, и только всем вместе!»<\/div>\n    <p>К танцам, песням и веселью будь готов — всегда готов! Если вы относите себя к числу незаурядных личностей, любите нестандартные решения и настоящее веселье — «Пионерская вечеринка» произведёт неизгладимое впечатление на гостей и надолго останется в вашей памяти.<\/p><\/div><\/div>\n    <div class=\"ph\" data-show=\"pioneers\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3033-6534-4537-a366-393963323037/-/resize/700x/IMG_5657.JPG\" data-full=\"https://static.tildacdn.info/tild3033-6534-4537-a366-393963323037/-/resize/1600x/IMG_5657.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3264-3636-4132-b162-333536323861/-/resize/700x/IMG_5660.JPG\" data-full=\"https://static.tildacdn.info/tild3264-3636-4132-b162-333536323861/-/resize/1600x/IMG_5660.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3331-3463-4261-b832-643833373234/-/resize/700x/IMG_5658.JPG\" data-full=\"https://static.tildacdn.info/tild3331-3463-4261-b832-643833373234/-/resize/1600x/IMG_5658.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3363-6366-4565-a439-626664373736/-/resize/700x/photo_52896730807356.jpg\" data-full=\"https://static.tildacdn.info/tild3363-6366-4565-a439-626664373736/-/resize/1600x/photo_52896730807356.jpg\"><\/div><\/article>\n\n  <article class=\"pcard\"><div class=\"txt\"><div><div class=\"no\">№ 2<span>Фольклор<\/span><\/div><h3><em>Аля<\/em> Русь<\/h3>\n    <p>Праздничная программа, которая обыграет популярные мотивы и клише русского фольклора. Ловко жонглирую скалкой и микрофоном, поём песни и танцуем под живой баян.<\/p><\/div><\/div>\n    <div class=\"ph\" data-show=\"alyarus\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3134-3165-4331-b265-636162616133/-/resize/700x/5208791794215675604.jpg\" data-full=\"https://static.tildacdn.info/tild3134-3165-4331-b265-636162616133/-/resize/1600x/5208791794215675604.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3263-6531-4133-a231-333838643839/-/resize/700x/IMG_5671.JPG\" data-full=\"https://static.tildacdn.info/tild3263-6531-4133-a231-333838643839/-/resize/1600x/IMG_5671.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3265-3032-4264-a530-343032393537/-/resize/700x/IMG_5664.JPG\" data-full=\"https://static.tildacdn.info/tild3265-3032-4264-a530-343032393537/-/resize/1600x/IMG_5664.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3664-3533-4136-b932-643730633338/-/resize/700x/5208791794215674606.jpg\" data-full=\"https://static.tildacdn.info/tild3664-3533-4136-b932-643730633338/-/resize/1600x/5208791794215674606.jpg\"><\/div><\/article>\n\n  <article class=\"pcard\"><div class=\"txt\"><div><div class=\"no\">№ 3<span>Корпоратив<\/span><\/div><h3>Вечеринка в стиле <em>90-х<\/em><\/h3>\n    <p>Мероприятие, на котором можно погрузиться в атмосферу свободы, евродэнса и лосин, отдохнуть, вспомнить прошлые года и просто невероятно провести время. Тематические песни, танцы, конкурсы и другие части программы помогут словно на машине времени вернуться в 90-е.<\/p><\/div><\/div>\n    <div class=\"ph\" data-show=\"nineties\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3162-3130-4233-a536-326332393965/-/resize/700x/photo_52896730807356.jpg\" data-full=\"https://static.tildacdn.info/tild3162-3130-4233-a536-326332393965/-/resize/1600x/photo_52896730807356.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3230-6332-4365-b464-623666303739/-/resize/700x/IMG_5614.JPG\" data-full=\"https://static.tildacdn.info/tild3230-6332-4365-b464-623666303739/-/resize/1600x/IMG_5614.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3266-6136-4734-b534-306262646333/-/resize/700x/IMG_5609.JPG\" data-full=\"https://static.tildacdn.info/tild3266-6136-4734-b534-306262646333/-/resize/1600x/IMG_5609.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3965-3762-4061-a635-356336646134/-/resize/700x/IMG_5618.JPG\" data-full=\"https://static.tildacdn.info/tild3965-3762-4061-a635-356336646134/-/resize/1600x/IMG_5618.JPG\"><\/div><\/article>\n\n  <article class=\"pcard\"><div class=\"txt\"><div><div class=\"no\">№ 4<span>Интерактив<\/span><\/div><h3>Тётя Зина — <em>тяжёлый люкс<\/em><\/h3>\n    <p>Уникальный феномен: тётка из глубинки, которая есть у каждого человека и которую забыли пригласить, но она добралась! От души душевно поздравит и впишется в любой момент на любом мероприятии — естественно, с гостинцами и максимально «зашкварными» историями и конкурсами!<\/p><\/div><\/div>\n    <div class=\"ph\" data-show=\"zina\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3265-3135-4138-a661-633262633065/-/resize/700x/IMG_5690.JPG\" data-full=\"https://static.tildacdn.info/tild3265-3135-4138-a661-633262633065/-/resize/1600x/IMG_5690.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3661-3137-4938-a436-356337636333/-/resize/700x/IMG_5691.JPG\" data-full=\"https://static.tildacdn.info/tild3661-3137-4938-a436-356337636333/-/resize/1600x/IMG_5691.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3937-6233-4236-a437-666332633034/-/resize/700x/IMG_5692.JPG\" data-full=\"https://static.tildacdn.info/tild3937-6233-4236-a437-666332633034/-/resize/1600x/IMG_5692.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild6536-3331-4232-b636-316139356563/-/resize/700x/IMG_5689.JPG\" data-full=\"https://static.tildacdn.info/tild6536-3331-4232-b636-316139356563/-/resize/1600x/IMG_5689.JPG\"><\/div><\/article>\n\n  <article class=\"pcard\"><div class=\"txt\"><div><div class=\"no\">№ 5<span>Юмор<\/span><\/div><h3>Потомственная <em>ведунья<\/em><\/h3>\n    <p>Интерактивная юмористическая программа, подходящая для любого события. Снимаю порчу, возвращаю денежный поток, соединяю судьбы, ставлю за s{grid-template-columns:repeat(2,1fr)}\n  .pr .stats .wrap{grid-template-columns:1fr}.pr .stat,.pr .stat:first-child{padding:40px 0;border-right:0;border-bottom:1px solid var(--line)}.pr .stat:last-child{border:0}\n  .pr .mos{grid-template-columns:repeat(2,1fr)}\n  .pr .rail{padding-left:24px}\n}\n@media(max-width:620px){\n  .pr{font-size:16px}\n  .pr .nav .wrap{height:64px}.pr .logo{font-size:20px}\n  .pr .nav .tlink{display:none}\n  .pr .steps,.pr .facts{grid-template-columns:1fr;gap:44px}\n  .pr .ph{grid-template-rows:200px 200px}\n  .pr .svc li{grid-template-columns:48px 1fr}\n  .pr .logos span{font-size:18px;min-height:84px;padding:14px}\n  .pr .rail figure{flex-basis:240px}\n  .pr .hero h1 em{margin-left:.3em}\n  .pr .words span{padding:0 12px}\n  .pr .btn{padding:16px 26px;white-space:normal;text-align:center}\n  .pr .mos figure:nth-child(1){grid-column:span 2;grid-row:span 1;aspect-ratio:4/3}\n}\n<\/style>\n\n<div class=\"pr\" id=\"pr\">\n\n<header class=\"nav\"><div class=\"wrap\">\n  <a class=\"logo\" href=\"#pr-top\">Елена <i>Голливудова<\/i><\/a>\n  <ul>\n    <li><a href=\"#pr-about\">Обо мне<\/a><\/li><li><a href=\"#pr-how\">Механика<\/a><\/li><li><a href=\"#pr-looks\">Образы<\/a><\/li>\n    <li><a href=\"#pr-rev\">Отзывы<\/a><\/li><li><a href=\"#pr-gal\">Галерея<\/a><\/li><li><a href=\"#pr-clients\">С кем работала<\/a><\/li><li><a href=\"#pr-contact\">Контакты<\/a><\/li>\n  <\/ul>\n  <a class=\"tlink\" href=\"#pr-contact\">Связаться со мной<\/a>\n<\/div><\/header>\n\n<section class=\"hero\" id=\"pr-top\">\n  <div class=\"l\">\n    <div class=\"eyebrow\">Артист эстрадного жанра<\/div>\n    <h1><span>Елена<\/span><span><em>Голливудова<\/em><\/span><\/h1>\n    <div class=\"words\"><span>Ярко<\/span><span>Душевно<\/span><span>Легко<\/span><span>Весело<\/span><\/div>\n    <p class=\"sub\">Ведущая, актриса и режиссёр праздников для событий любого формата.<\/p>\n    <div class=\"cta\"><a class=\"btn\" href=\"#pr-contact\">Связаться со мной<\/a><a class=\"tlink\" href=\"#pr-looks\">Смотреть образы<\/a><\/div>\n  <\/div>\n  <div class=\"r\">\n    <img src=\"https://static.tildacdn.info/tild3466-3434-4938-a538-383463613738/-/resize/1000x/photo_52627329499111.jpg\" alt=\"Елена Голливудова\">\n  <\/div>\n<\/section>\n\n<section class=\"about\" id=\"pr-about\"><div class=\"wrap\">\n  <div class=\"rv\">\n    <div class=\"eyebrow\">Обо мне<\/div>\n    <h2 style=\"margin-top:22px\">Живу <em>праздником<\/em> уже 20 лет<\/h2>\n    <p class=\"q\">У меня профессиональное образование и я знаю, о чём говорю: окончила театральное училище и стала дипломированным специалистом — <b>режиссёр театрализованных представлений и праздников (СПбГУКИ)<\/b>.<\/p>\n  <\/div>\n  <ul class=\"svc rv\">\n    <li><i>01<\/i>Ведущая на любой праздник<\/li>\n    <li><i>02<\/i>Актриса с театрализованной программой<\/li>\n    <li><i>03<\/i>Тематические розыгрыши и перфомансы<\/li>\n    <li><i>04<\/i>Экспресс-поздравления близким и друзьям<\/li>\n    <li><i>05<\/i>Яркий welcome, где сделаем необычные фото для ваших соцсетей<\/li>\n    <li><i>06<\/i>Календарные праздники, мальчишники и девичники, свадьбы и корпоративы<\/li>\n  <\/ul>\n<\/div><\/section>\n\n<section class=\"stats\"><div class=\"wrap rv\">\n  <div class=\"stat\"><b>15<sup>+<\/sup><\/b><p>лет в сфере создания праздников<\/p><\/div>\n  <div class=\"stat\"><b>1000<sup>+<\/sup><\/b><p>реализованных проектов с оригинальной концепцией<\/p><\/div>\n  <div class=\"stat t\"><b>Настоящее шоу<\/b><p>Незабываемые впечатления для каждого гостя от настоящих артистов на празднике любого формата.<\/p><\/div>\n<\/div><\/section>\n\n<section class=\"how dark\" id=\"pr-how\"><div class=\"wrap\">\n  <div class=\"hd rv\">\n    <div><div class=\"eyebrow\">Как это работает<\/div><h2 style=\"margin-top:22px\">Механика <em>работы<\/em><\/h2><\/div>\n    <p>Индивидуальный подход к каждому событию: пишу индивидуальный сценарий и создаю тематические образы и внешний вид под каждый праздник.<\/p>\n  <\/div>\n  <div class=\"steps\">\n    <div class=\"step rv\"><div class=\"n\">I<\/div><h3>Обсуждение деталей<\/h3><ul><li>обсуждение концепции<\/li><li>возможно написание сценария под заказ<\/li><li>приглашение DJ, аквагримёра и др. специалистов<\/li><li>обсуждение тайминга мероприятия<\/li><\/ul><\/div>\n    <div class=\"step rv\"><div class=\"n\">II<\/div><h3>Выбор образа<\/h3><ul><li>более 20 готовых образов<\/li><li>создание образа под ваш запрос<\/li><li>приглашение дополнительных артистов<\/li><\/ul><\/div>\n    <div class=\"step rv\"><div class=\"n\">III<\/div><h3>Встреча с заказчиком<\/h3><p>Если вы хотите обсудить сценарий или концепцию моего выхода, мы можем созвониться или встретиться лично.<\/p><\/div>\n    <div class=\"step rv\"><div class=\"n\">IV<\/div><h3>Внесение предоплаты<\/h3><p>Для бронирования даты и времени.<\/p><\/div>\n    <div class=\"step rv\"><div class=\"n\">V<\/div><h3>Остаток оплаты<\/h3><p>После оплаты я буду рада услышать или прочитать отзыв.<\/p><\/div>\n    <div class=\"step rv\"><div class=\"n\">VI<\/div><h3>Праздник<\/h3><p>Веселимся до упаду или культурно проводим время в отличной компании!<\/p><\/div>\n  <\/div>\n<\/div><\/section>\n\n<section class=\"looks\" id=\"pr-looks\"><div class=\"wrap\">\n  <div class=\"hd rv\"><div class=\"eyebrow\">Образы<\/div><h2>Готовые <em>образы<\/em><\/h2><p>Не нашли своего? Создам образ под ваш запрос.<\/p><\/div>\n  <div class=\"index rv\" data-looks><span>Тётя Зина<\/span><span>Снегурочка<\/span><span>Морячка<\/span><span>Проводница<\/span><span>Итальянская Дона<\/span><span>Полицейская<\/span><span>Пионерка<\/span><span>Таролог-нумеролог<\/span><span>Буфетчица<\/span><span>Прапорщица<\/span><span>Стюардесса<\/span><span>Екатерина II<\/span><span>Солоха<\/span><span>Цыганка<\/span><span>Роза<\/span><span>Ясновидящая гадалка<\/span><span>Челночница из 90-х<\/span><span>Бородатая женщина<\/span><span>Викинг<\/span><span>Тамада<\/span><span>Стимпанк<\/span><span>Кассир<\/span><span>Ковбойша<\/span><span>Врач<\/span><span>Невеста<\/span><span>Крановщица<\/span><span>Рокерша<\/span><span>Ведьма<\/span><span>Русская красавица<\/span><span>Бабка-сплетница с лавки<\/span><\/div>\n  <div class=\"cta rv\"><a class=\"btn\" href=\"#pr-contact\">Связаться со мной<\/a><\/div>\n<\/div><\/section>\n\n<section class=\"shows dark\"><div class=\"wrap\">\n  <div class=\"hd rv\"><div class=\"eyebrow\">Программы<\/div><h2>Какие образы чаще всего <em>выбирают?<\/em><\/h2><\/div>\n\n  <div class=\"show rv\"><div class=\"txt\"><div class=\"k\">Пионеры<\/div><h3>Пионерская <em>вечеринка<\/em><\/h3>\n    <div class=\"q\">«Ни шагу назад, ни шагу на месте, а только вперёд, и только всем вместе!»<\/div>\n    <p>К танцам, песням и веселью будь готов — всегда готов! Если вы относите себя к числу незаурядных личностей, любите нестандартные решения и настоящее веселье — «Пионерская вечеринка» произведёт неизгладимое впечатление на гостей и надолго останется в вашей памяти.<\/p><\/div>\n    <div class=\"ph\" data-show=\"pioneers\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3033-6534-4537-a366-393963323037/-/resize/700x/IMG_5657.JPG\" data-full=\"https://static.tildacdn.info/tild3033-6534-4537-a366-393963323037/-/resize/1600x/IMG_5657.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3264-3636-4132-b162-333536323861/-/resize/700x/IMG_5660.JPG\" data-full=\"https://static.tildacdn.info/tild3264-3636-4132-b162-333536323861/-/resize/1600x/IMG_5660.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3331-3463-4261-b832-643833373234/-/resize/700x/IMG_5658.JPG\" data-full=\"https://static.tildacdn.info/tild3331-3463-4261-b832-643833373234/-/resize/1600x/IMG_5658.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3363-6366-4565-a439-626664373736/-/resize/700x/photo_52896730807356.jpg\" data-full=\"https://static.tildacdn.info/tild3363-6366-4565-a439-626664373736/-/resize/1600x/photo_52896730807356.jpg\"><\/div><\/div>\n\n  <div class=\"show rv\"><div class=\"txt\"><div class=\"k\">Фольклор<\/div><h3><em>Аля<\/em> Русь<\/h3>\n    <p>Праздничная программа, которая обыграет популярные мотивы и клише русского фольклора. Ловко жонглирую скалкой и микрофоном, поём песни и танцуем под живой баян.<\/p><\/div>\n    <div class=\"ph\" data-show=\"alyarus\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3134-3165-4331-b265-636162616133/-/resize/700x/5208791794215675604.jpg\" data-full=\"https://static.tildacdn.info/tild3134-3165-4331-b265-636162616133/-/resize/1600x/5208791794215675604.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3263-6531-4133-a231-333838643839/-/resize/700x/IMG_5671.JPG\" data-full=\"https://static.tildacdn.info/tild3263-6531-4133-a231-333838643839/-/resize/1600x/IMG_5671.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3265-3032-4264-a530-343032393537/-/resize/700x/IMG_5664.JPG\" data-full=\"https://static.tildacdn.info/tild3265-3032-4264-a530-343032393537/-/resize/1600x/IMG_5664.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3664-3533-4136-b932-643730633338/-/resize/700x/5208791794215674606.jpg\" data-full=\"https://static.tildacdn.info/tild3664-3533-4136-b932-643730633338/-/resize/1600x/5208791794215674606.jpg\"><\/div><\/div>\n\n  <div class=\"show rv\"><div class=\"txt\"><div class=\"k\">Корпоратив<\/div><h3>Вечеринка в стиле <em>90-х<\/em><\/h3>\n    <p>Мероприятие, на котором можно погрузиться в атмосферу свободы, евродэнса и лосин, отдохнуть, вспомнить прошлые года и просто невероятно провести время. Тематические песни, танцы, конкурсы и другие части программы помогут словно на машине времени вернуться в 90-е.<\/p><\/div>\n    <div class=\"ph\" data-show=\"nineties\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3162-3130-4233-a536-326332393965/-/resize/700x/photo_52896730807356.jpg\" data-full=\"https://static.tildacdn.info/tild3162
