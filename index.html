  .stage{padding:10px 10px 6px}

/a>\n<\/div><\/header>\n\n<section class=\"hero\" id=\"gl-top\"><div class=\"wrap\">\n  <div>\n    <div class=\"eyebrow\">Артист эстрадного жанра<\/div>\n    <h1><span class=\"gold\">Елена<\/span><em class=\"gold\">Голливудова<\/em><\/h1>\n    <div class=\"tag\"><span>Ярко.<\/span><span>Душевно.<\/span><span>Легко.<\/span><span>Весело<\/span><\/div>\n    <p class=\"sub\">Живу праздником уже 20 лет. Ведущая, актриса и «тётя Зина» — для вашего события любого формата.<\/p>\n    <div class=\"cta\">\n      <a class=\"btn fill\" href=\"#gl-contact\">Связаться со мной<\/a>\n      <a class=\"btn line\" href=\"#gl-looks\">Смотреть образы<\/a>\n    <\/div>\n  <\/div>\n  <div class=\"arch\">\n    <span class=\"spark s1\">✦<\/span><span class=\"spark s2\">✦<\/span><span class=\"spark s3\">✦<\/span>\n    <div class=\"frame\"><img src=\"https://static.tildacdn.info/tild3466-3434-4938-a538-383463613738/-/resize/1000x/photo_52627329499111.jpg\" alt=\"Елена Голливудова\"><\/div>\n    <div class=\"badge\"><div><b>20<\/b>лет<br>праздника<\/div><\/div>\n  <\/div>\n<\/div><\/section>\n\n<div class=\"mq\"><div>\n  <span>Ярко<\/span><i>✦<\/i><span>Душевно<\/span><i>✦<\/i><span>Легко<\/span><i>✦<\/i><span>Весело<\/span><i>✦<\/i>\n  <span>Ярко<\/span><i>✦<\/i><span>Душевно<\/span><i>✦<\/i><span>Легко<\/span><i>✦<\/i><span>Весело<\/span><i>✦<\/i>\n  <span>Ярко<\/span><i>✦<\/i><span>Душевно<\/span><i>✦<\/i><span>Легко<\/span><i>✦<\/i><span>Весело<\/span><i>✦<\/i>\n  <span>Ярко<\/span><i>✦<\/i><span>Душевно<\/span><i>✦<\/i><span>Легко<\/span><i>✦<\/i><span>Весело<\/span><i>✦<\/i>\n<\/div><\/div>\n\n<section class=\"about\" id=\"gl-about\"><div class=\"wrap\">\n  <div class=\"rv\">\n    <div class=\"eyebrow\">Обо мне<\/div>\n    <h2 style=\"margin-top:16px\">Живу <em class=\"gold\">праздником<\/em> уже 20 лет<\/h2>\n    <p class=\"lead\">У меня профессиональное образование и я знаю, о чём говорю: окончила театральное училище и стала дипломированным специалистом — <b>режиссёр театрализованных представлений и праздников (СПбГУКИ)<\/b>.<\/p>\n    <div class=\"tour\">Гастролирую: <span>Москва<\/span><span>Сочи<\/span><span>Турция<\/span><span>Баку<\/span><\/div>\n  <\/div>\n  <ul class=\"svc rv\">\n    <li><i>01<\/i>Ведущая на любой праздник<\/li>\n    <li><i>02<\/i>Актриса с театрализованной программой<\/li>\n    <li><i>03<\/i>Тематические розыгрыши и перфомансы<\/li>\n    <li><i>04<\/i>Экспресс-поздравления близким и друзьям<\/li>\n    <li><i>05<\/i>Устрою яркий welcome, где сделаем необычные фото для ваших соцсетей<\/li>\n    <li><i>06<\/i>Календарные праздники, мальчишники и девичники, свадьбы и корпоративы<\/li>\n  <\/ul>\n<\/div><\/section>\n\n<section class=\"stats\"><div class=\"wrap\">\n  <div class=\"stat rv\"><b class=\"gold\">15+<\/b><p>лет в сфере создания праздников<\/p><\/div>\n  <div class=\"stat rv\"><b class=\"gold\">1000+<\/b><p>реализованных проектов с оригинальной концепцией<\/p><\/div>\n  <div class=\"stat big rv\"><b>Настоящее шоу<\/b><p>Незабываемые впечатления для каждого гостя от настоящих артистов на празднике любого формата<\/p><\/div>\n<\/div><\/section>\n\n<section class=\"how\" id=\"gl-how\"><div class=\"wrap\">\n  <div class=\"hd rv\">\n    <div><div class=\"eyebrow\">Как это работает<\/div><h2 style=\"margin-top:14px\">Механика <em class=\"gold\">работы<\/em><\/h2><\/div>\n    <p>Индивидуальный подход к каждому событию. Написание индивидуального сценария, создание тематических образов и внешнего вида под каждый праздник.<\/p>\n  <\/div>\n  <div class=\"steps\">\n    <div class=\"step rv\"><div class=\"n gold\">01<\/div><h3>Обсуждение деталей<\/h3>\n      <ul><li>обсуждение концепции<\/li><li>возможно написание сценария под заказ<\/li><li>приглашение DJ, аквагримёра и др. специалистов<\/li><li>обсуждение тайминга мероприятия<\/li><\/ul><\/div>\n    <div class=\"step rv\"><div class=\"n gold\">02<\/div><h3>Выбор образа<\/h3>\n      <ul><li>более 20 готовых образов<\/li><li>создание образа под ваш запрос<\/li><li>приглашение дополнительных артистов<\/li><\/ul><\/div>\n    <div class=\"step rv\"><div class=\"n gold\">03<\/div><h3>Встреча с заказчиком<\/h3>\n      <p>Если вы хотите обсудить сценарий или концепцию моего выхода, мы можем созвониться или встретиться лично.<\/p><\/div>\n    <div class=\"step rv\"><div class=\"n gold\">04<\/div><h3>Внесение предоплаты<\/h3>\n      <p>Для бронирования даты и времени.<\/p><\/div>\n    <div class=\"step rv\"><div class=\"n gold\">05<\/div><h3>Остаток оплаты<\/h3>\n      <p>После оплаты я буду рада услышать или прочитать отзыв.<\/p><\/div>\n    <div class=\"step rv\"><div class=\"n gold\">06<\/div><h3>Праздник!<\/h3>\n      <p>Веселимся до упаду или культурно проводим время в отличной компании!<\/p><\/div>\n  <\/div>\n<\/div><\/section>\n\n<section class=\"looks\" id=\"gl-looks\"><div class=\"wrap\">\n  <div class=\"hd rv\">\n    <div class=\"eyebrow\">Образы<\/div>\n    <h2 style=\"margin-top:14px\">Готовые <em class=\"gold\">образы<\/em><\/h2>\n    <p>Не нашли своего? Создам образ под ваш запрос.<\/p>\n  <\/div>\n  <div class=\"chips rv\" data-looks><span>Тётя Зина<\/span><span>Снегурочка<\/span><span>Морячка<\/span><span>Проводница<\/span><span>Итальянская Дона<\/span><span>Полицейская<\/span><span>Пионерка<\/span><span>Таролог-нумеролог<\/span><span>Буфетчица<\/span><span>Прапорщица<\/span><span>Стюардесса<\/span><span>Екатерина II<\/span><span>Солоха<\/span><span>Цыганка<\/span><span>Роза<\/span><span>Ясновидящая гадалка<\/span><span>Челночница из 90-х<\/span><span>Бородатая женщина<\/span><span>Викинг<\/span><span>Тамада<\/span><span>Стимпанк<\/span><span>Кассир<\/span><span>Ковбойша<\/span><span>Врач<\/span><span>Невеста<\/span><span>Крановщица<\/span><span>Рокерша<\/span><span>Ведьма<\/span><span>Русская красавица<\/span><span>Бабка-сплетница с лавки<\/span><\/div>\n  <div class=\"cta rv\"><a class=\"btn fill\" href=\"#gl-contact\">Связаться со мной<\/a><\/div>\n<\/div><\/section>\n\n<section class=\"shows\"><div class=\"wrap\">\n  <div class=\"hd rv\"><div class=\"eyebrow\">Программы<\/div><h2 style=\"margin-top:14px\">Какие образы чаще всего <em class=\"gold\">выбирают?<\/em><\/h2><\/div>\n\n  <div class=\"show rv\"><div class=\"txt\">\n    <div class=\"eyebrow\">Пионеры<\/div><h3>Пионерская <span class=\"gold\">вечеринка<\/span><\/h3>\n    <div class=\"q\">«Ни шагу назад, ни шагу на месте, а только вперёд, и только всем вместе!»<\/div>\n    <p>К танцам, песням и веселью будь готов — всегда готов!!! Если вы относите себя к числу незаурядных личностей, любите нестандартные решения и настоящее веселье — «Пионерская вечеринка» произведёт неизгладимое впечатление на гостей и надолго останется в вашей памяти.<\/p><\/div>\n    <div class=\"ph\" data-show=\"pioneers\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3033-6534-4537-a366-393963323037/-/resize/700x/IMG_5657.JPG\" data-full=\"https://static.tildacdn.info/tild3033-6534-4537-a366-393963323037/-/resize/1600x/IMG_5657.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3264-3636-4132-b162-333536323861/-/resize/700x/IMG_5660.JPG\" data-full=\"https://static.tildacdn.info/tild3264-3636-4132-b162-333536323861/-/resize/1600x/IMG_5660.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3331-3463-4261-b832-643833373234/-/resize/700x/IMG_5658.JPG\" data-full=\"https://static.tildacdn.info/tild3331-3463-4261-b832-643833373234/-/resize/1600x/IMG_5658.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3363-6366-4565-a439-626664373736/-/resize/700x/photo_52896730807356.jpg\" data-full=\"https://static.tildacdn.info/tild3363-6366-4565-a439-626664373736/-/resize/1600x/photo_52896730807356.jpg\"><\/div><\/div>\n\n  <div class=\"show rv\"><div class=\"txt\">\n    <div class=\"eyebrow\">Фольклор<\/div><h3><span class=\"gold\">Аля Русь<\/span><\/h3>\n    <p>Праздничная программа, которая обыграет популярные мотивы и клише русского фольклора. Ловко жонглирую скалкой и микрофоном, поём песни и танцуем под живой баян.<\/p><\/div>\n    <div class=\"ph\" data-show=\"alyarus\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3134-3165-4331-b265-636162616133/-/resize/700x/5208791794215675604.jpg\" data-full=\"https://static.tildacdn.info/tild3134-3165-4331-b265-636162616133/-/resize/1600x/5208791794215675604.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3263-6531-4133-a231-333838643839/-/resize/700x/IMG_5671.JPG\" data-full=\"https://static.tildacdn.info/tild3263-6531-4133-a231-333838643839/-/resize/1600x/IMG_5671.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3265-3032-4264-a530-343032393537/-/resize/700x/IMG_5664.JPG\" data-full=\"https://static.tildacdn.info/tild3265-3032-4264-a530-343032393537/-/resize/1600x/IMG_5664.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3664-3533-4136-b932-643730633338/-/resize/700x/5208791794215674606.jpg\" data-full=\"https://static.tildacdn.info/tild3664-3533-4136-b932-643730633338/-/resize/1600x/5208791794215674606.jpg\"><\/div><\/div>\n\n  <div class=\"show rv\"><div class=\"txt\">\n    <div class=\"eyebrow\">Корпоратив<\/div><h3>Вечеринка в стиле <span class=\"gold\">90-х<\/span><\/h3>\n    <p>Мероприятие, на котором можно погрузиться в атмосферу свободы, евродэнса и лосин, отдохнуть, вспомнить прошлые года и просто невероятно провести время. Тематические песни, танцы, конкурсы и другие части программы помогут словно на машине времени вернуться в 90-е.<\/p><\/div>\n    <div class=\"ph\" data-show=\"nineties\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3162-3130-4233-a536-326332393965/-/resize/700x/photo_52896730807356.jpg\" data-full=\"https://static.tildacdn.info/tild3162-3130-4233-a536-326332393965/-/resize/1600x/photo_52896730807356.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3230-6332-4365-b464-623666303739/-/resize/700x/IMG_5614.JPG\" d Внесение предоплаты<\/h3><p>Для бронирования даты и времени.<\/p><\/div>\n    <div class=\"step rv\"><div class=\"n\">5<\/div><h3>Остаток оплаты<\/h3><p>После оплаты я буду рада услышать или прочитать отзыв.<\/p><\/div>\n    <div class=\"step rv\"><div class=\"n\">6<\/div><h3>Праздник!<\/h3><p>Веселимся до упаду или культурно проводим время в отличной компании!<\/p><\/div>\n  <\/div>\n<\/div><\/section>\n\n<section class=\"looks\" id=\"pp-looks\"><div class=\"wrap\">\n  <div class=\"hd rv\"><h2>Готовые <mark>образы<\/mark><\/h2><p>Нажмите «связаться» — подберём образ или придумаем новый под ваш запрос<\/p><\/div>\n  <div class=\"chips rv\" data-looks><span>Тётя Зина<\/span><span>Снегурочка<\/span><span>Морячка<\/span><span>Проводница<\/span><span>Итальянская Дона<\/span><span>Полицейская<\/span><span>Пионерка<\/span><span>Таролог-нумеролог<\/span><span>Буфетчица<\/span><span>Прапорщица<\/span><span>Стюардесса<\/span><span>Екатерина II<\/span><span>Солоха<\/span><span>Цыганка<\/span><span>Роза<\/span><span>Ясновидящая гадалка<\/span><span>Челночница из 90-х<\/span><span>Бородатая женщина<\/span><span>Викинг<\/span><span>Тамада<\/span><span>Стимпанк<\/span><span>Кассир<\/span><span>Ковбойша<\/span><span>Врач<\/span><span>Невеста<\/span><span>Крановщица<\/span><span>Рокерша<\/span><span>Ведьма<\/span><span>Русская красавица<\/span><span>Бабка-сплетница с лавки<\/span><\/div>\n  <div class=\"cta rv\" style=\"display:flex\"><a class=\"btn pink\" href=\"#pp-contact\">Связаться со мной<\/a><\/div>\n<\/div><\/section>\n\n<section class=\"shows\"><div class=\"wrap\">\n  <h2 class=\"rv\">Какие образы чаще всего <mark>выбирают?<\/mark><\/h2>\n\n  <div class=\"show rv\"><div class=\"txt\"><span class=\"k\">Пионеры<\/span><h3>Пионерская <em>вечеринка<\/em><\/h3>\n    <div class=\"q\">«Ни шагу назад, ни шагу на месте, а только вперёд, и только всем вместе!»<\/div>\n    <p>К танцам, песням и веселью будь готов — всегда готов!!! Если вы относите себя к числу незаурядных личностей, и и девичники, свадьбы и корпоративы<\/li>\n    <\/ol>\n  <\/div>\n<\/div><\/section>\n\n<section class=\"stats\"><div class=\"wrap rv\">\n  <div class=\"stat\"><b>15+<\/b><p>лет в сфере создания праздников<\/p><\/div>\n  <div class=\"stat\"><b>1000+<\/b><p>реализованных проектов с оригинальной концепцией<\/p><\/div>\n  <div class=\"stat\"><b>Настоящее шоу<\/b><p>Незабываемые впечатления для каждого гостя от настоящих артистов на празднике любого формата<\/p><\/div>\n<\/div><\/section>\n\n<section class=\"how\" id=\"rt-how\"><div class=\"wrap\">\n  <div class=\"hd rv\"><div><div class=\"kicker\">Как всё устроено<\/div><h2>Механика <em>работы<\/em><\/h2><\/div>\n    <p>Индивидуальный подход к каждому событию: пишу индивидуальный сценарий и создаю тематические образы и внешний вид под каждый праздник.<\/p><\/div>\n  <div class=\"steps\">\n    <div class=\"tk rv\"><div class=\"b\"><h3>Обсуждение деталей<\/h3><ul><li>обсуждение концепции<\/li><li>возможно написание сценария под заказ<\/li><li>приглашение DJ, аквагримёра и др. специалистов<\/li><li>обсуждение тайминга мероприятия<\/li><\/ul><\/div><div class=\"s\"><div><small>шаг<\/small>01<\/div><\/div><\/div>\n    <div class=\"tk rv\"><div class=\"b\"><h3>Выбор образа<\/h3><ul><li>более 20 готовых образов<\/li><li>создание образа под ваш запрос<\/li><li>приглашение дополнительных артистов<\/li><\/ul><\/div><div class=\"s\"><div><small>шаг<\/small>02<\/div><\/div><\/div>\n    <div class=\"tk rv\"><div class=\"b\"><h3>Встреча с заказчиком<\/h3><p>Если вы хотите обсудить сценарий или концепцию моего выхода, мы можем созвониться или встретиться лично.<\/p><\/div><div class=\"s\"><div><small>шаг<\/small>03<\/div><\/div><\/div>\n    <div class=\"tk rv\"><div class=\"b\"><h3>Внесение предоплаты<\/h3><p>Для бронирования даты и времени.<\/p><\/div><div class=\"s\"><div><small>шаг<\/small>04<\/div><\/div><\/div>\n    <div class=\"tk rv\"><div class=\"b\"><h3>Остаток оплаты<\/h3><p>После оплаты я буду рада услышать или прочитать лена<\/span><span><em>Голливудова<\/em><\/span><\/h1>\n    <div class=\"words\"><span>Ярко<\/span><span>Душевно<\/span><span>Легко<\/span><span>Весело<\/span><\/div>\n    <p class=\"sub\">Живу праздником уже 20 лет. Ведущая, актриса и режиссёр праздников для событий любого формата.<\/p>\n    <div class=\"cta\"><a class=\"btn\" href=\"#pr-contact\">Связаться со мной<\/a><a class=\"tlink\" href=\"#pr-looks\">Смотреть образы<\/a><\/div>\n  <\/div>\n  <div class=\"r\">\n    <img src=\"https://static.tildacdn.info/tild3466-3434-4938-a538-383463613738/-/resize/1000x/photo_52627329499111.jpg\" alt=\"Елена Голливудова\">\n    <div class=\"cap\"><b>20 лет<\/b>праздника<\/div>\n  <\/div>\n<\/section>\n\n<section class=\"about\" id=\"pr-about\"><div class=\"wrap\">\n  <div class=\"rv\">\n    <div class=\"eyebrow\">Обо мне<\/div>\n    <h2 style=\"margin-top:22px\">Живу <em>праздником<\/em> уже 20 лет<\/h2>\n    <p class=\"q\">У меня профессиональное образование и я знаю, о чём говорю: окончила театральное училище и стала дипломированным специалистом — <b>режиссёр театрализованных представлений и праздников (СПбГУКИ)<\/b>.<\/p>\n    <div class=\"tour\">Гастролирую: <b>Москва<\/b><b>Сочи<\/b><b>Турция<\/b><b>Баку<\/b><\/div>\n  <\/div>\n  <ul class=\"svc rv\">\n    <li><i>01<\/i>Ведущая на любой праздник<\/li>\n    <li><i>02<\/i>Актриса с театрализованной программой<\/li>\n    <li><i>03<\/i>Тематические розыгрыши и перфомансы<\/li>\n    <li><i>04<\/i>Экспресс-поздравления близким и друзьям<\/li>\n    <li><i>05<\/i>Яркий welcome, где сделаем необычные фото для ваших соцсетей<\/li>\n    <li><i>06<\/i>Календарные праздники, мальчишники и девичники, свадьбы и корпоративы<\/li>\n  <\/ul>\n<\/div><\/section>\n\n<section class=\"stats\"><div class=\"wrap rv\">\n  <div class=\"stat\"><b>15<sup>+<\/sup><\/b><p>лет в сфере создания праздников<\/p><\/div>\n  <div class=\"stat\"><b>1000<sup>+<\/sup><\/b><p>реализованных проектов с оригинальной концепцией<\/p><\/div>\n  <div class=\"stat t\"><b>Настоящее шоу<\/b><p>Незабываемые впечатления для каждого гостя от настоящих артистов на празднике любого формата.<\/p><\/div>\n<\/div><\/section>\n\n<section class=\"how dark\" id=\"pr-how\"><div class=\"wrap\">\n  <div class=\"hd rv\">\n    <div><div class=\"eyebrow\">Как это работает<\/div><h2 style=\"margin-top:22px\">Механика <em>работы<\/em><\/h2><\/div>\n    <p>Индивидуальный подход к каждому событию: пишу индивидуальный сценарий и создаю тематические образы и внешний вид под каждый праздник.<\/p>\n  <\/div>\n  <div class=\"steps\">\n    <div class=\"step rv\"><div class=\"n\">I<\/div><h3>Обсуждение деталей<\/h3><ul><li>обсуждение концепции<\/li><li>возможно написание сценария под заказ<\/li><li>приглашение DJ, аквагримёра и др. специалистов<\/li><li>обсуждение тайминга мероприятия<\/li><\/ul><\/div>\n    <div class=\"step rv\"><div class=\"n\">II<\/div><h3>Выбор образа<\/h3><ul><li>более 20 готовых образов<\/li><li>создание образа под ваш запрос<\/li><li>приглашение дополнительных артистов<\/li><\/ul><\/div>\n    <div class=\"step rv\"><div class=\"n\">III<\/div><h3>Встреча с заказчиком<\/h3><p>Если вы хотите обсудить сценарий или концепцию моего выхода, мы можем созвониться или встретиться лично.<\/p><\/div>\n    <div class=\"step rv\"><div class=\"n\">IV<\/div><h3>Внесение предоплаты<\/h3><p>Для бронирования даты и времени.<\/p><\/div>\n    <div class=\"step rv\"><div class=\"n\">V<\/div><h3>Остаток оплаты<\/h3><p>После оплаты я буду рада услышать или прочитать отзыв.<\/p><\/div>\n    <div class=\"step rv\"><div class=\"n\">VI<\/div><h3>Праздник<\/h3><p>Веселимся до упаду или культурно проводим время в отличной компании!<\/p><\/div>\n  <\/div>\n<\/div><\/section>\n\n<section class=\"looks\" id=\"pr-looks\"><div class=\"wrap\">\n  <div class=\"hd rv\"><div class=\"eyebrow\">Образы<\/div><h2>Готовые <em>образы<\/em><\/h2><p>Не нашли своего? Создам образ под ваш запрос.<\/p><\/div>\n  <div class=\"index rv\" data-looks><span>Тётя Зина<\/span><span>Снегурочка<\/span><span>Морячка<\/span><span>Проводница<\/span><span>Итальянская Дона<\/span><span>Полицейская<\/span><span>Пионерка<\/span><span>Таролог-нумеролог<\/span><span>Буфетчица<\/span><span>Прапорщица<\/span><span>Стюардесса<\/span><span>Екатерина II<\/span><span>Солоха<\/span><span>Цыганка<\/span><span>Роза<\/span><span>Ясновидящая гадалка<\/span><span>Челночница из 90-х<\/span><span>Бородатая женщина<\/span><span>Викинг<\/span><span>Тамада<\/span><span>Стимпанк<\/span><span>Кассир<\/span><span>Ковбойша<\/span><span>Врач<\/span><span>Невеста<\/span><span>Крановщица<\/span><span>Рокерша<\/span><span>Ведьма<\/span><span>Русская красавица<\/span><span>Бабка-сплетница с лавки<\/span><\/div>\n  <div class=\"cta rv\"><a class=\"btn\" href=\"#pr-contact\">Связаться со мной<\/a><\/div>\n<\/div><\/section>\n\n<section class=\"shows dark\"><div class=\"wrap\">\n  <div class=\"hd rv\"><div class=\"eyebrow\">Программы<\/div><h2>Какие образы чаще всего <em>выбирают?<\/em><\/h2><\/div>\n\n  <div class=\"show rv\"><div class=\"txt\"><div class=\"k\">Пионеры<\/div><h3>Пионерская <em>вечеринка<\/em><\/h3>\n    <div class=\"q\">«Ни шагу назад, ни шагу на месте, а только вперёд, и только всем вместе!»<\/div>\n    <p>К танцам, песням и веселью будь готов — всегда готов! Если вы относите себя к числу незаурядных личностей, любите нестандартные решения и настоящее веселье — «Пионерская вечеринка» произведёт неизгладимое впечатление на гостей и надолго останется в вашей памяти.<\/p><\/div>\n    <div class=\"ph\" data-show=\"pioneers\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3033-6534-4537-a366-393963323037/-/resize/700x/IMG_5657.JPG\" data-full=\"https://static.tildacdn.info/tild3033-6534-4537-a366-393963323037/-/resize/1600x/IMG_5657.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3264-3636-4132-b162-333536323861/-/resize/700x/IMG_5660.JPG\" data-full=\"https://static.tildacdn.info/tild3264-3636-4132-b162-333536323861/-/resize/1600x/IMG_5660.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3331-3463-4261-b832-643833373234/-/resize/700x/IMG_5658.JPG\" data-full=\"https://static.tildacdn.info/tild3331-3463-4261-b832-643833373234/-/resize/1600x/IMG_5658.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3363-6366-4565-a439-626664373736/-/resize/700x/photo_52896730807356.jpg\" data-full=\"https://static.tildacdn.info/tild3363-6366-4565-a439-626664373736/-/resize/1600x/photo_52896730807356.jpg\"><\/div><\/div>\n\n  <div class=\"show rv\"><div class=\"txt\"><div class=\"k\">Фольклор<\/div><h3><em>Аля<\/em> Русь<\/h3>\n    <p>Праздничная программа, которая обыграет популярные мотивы и клише русского фольклора. Ловко жонглирую скалкой и микрофоном, поём песни и танцуем под живой баян.<\/p><\/div>\n    <div class=\"ph\" data-show=\"alyarus\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3134-3165-4331-b265-636162616133/-/resize/700x/5208791794215675604.jpg\" data-full=\"https://static.tildacdn.info/tild3134-3165-4331-b265-636162616133/-/resize/1600x/5208791794215675604.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3263-6531-4133-a231-333838643839/-/resize/700x/IMG_5671.JPG\" data-full=\"https://static.tildacdn.info/tild3263-6531-4133-a231-333838643839/-/resize/1600x/IMG_5671.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3265-3032-4264-a530-343032393537/-/resize/700x/IMG_5664.JPG\" data-full=\"https://static.tildacdn.info/tild3265-3032-4264-a530-343032393537/-/resize/1600x/IMG_5664.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3664-3533-4136-b932-643730633338/-/resize/700x/5208791794215674606.jpg\" data-full=\"https://static.tildacdn.info/tild3664-3533-4136-b932-643730633338/-/resize/1600x/5208791794215674606.jpg\"><\/div><\/div>\n\n  <div class=\"show rv\"><div class=\"txt\"><div class=\"k\">Корпоратив<\/div><h3>Вечеринка в стиле <em>90-х<\/em><\/h3>\n    <p>Мероприятие, на котором можно погрузиться в атмосферу свободы, евродэнса и лосин, отдохнуть, вспомнить прошлые года и просто невероятно провести время. Тематические песни, танцы, конкурсы и другие части программы помогут словно на машине времени вернуться в 90-е.<\/p><\/div>\n    <div class=\"ph\" data-show=\"nineties\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3162-3130-4233-a536-326332393965/-/resize/700x/photo_52896730807356.jpg\" data-full=\"https://static.tildacdn.info/tild3162-3130-4233-a536-326332393965/-/resize/1600x/photo_52896730807356.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3230-6332-4365-b464-623666303739/-/resize/700x/IMG_5614.JPG\" data-full=\"https://static.tildacdn.info/tild3230-6332-4365-b464-623666303739/-/resize/1600x/IMG_5614.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3266-6136-4734-b534-306262646333/-/resize/700x/IMG_5609.JPG\" data-full=\"https://static.tildacdn.info/tild3266-6136-4734-b534-306262646333/-/resize/1600x/IMG_5609.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3965-3762-4061-a635-356336646134/-/resize/700x/IMG_5618.JPG\" data-full=\"https://static.tildacdn.info/tild3965-3762-4061-a635-356336646134/-/resize/1600x/IMG_5618.JPG\"><\/div><\/div>\n\n  <div class=\"show rv\"><div class=\"txt\"><div class=\"k\">Интерактив<\/div><h3>Тётя Зина — <em>тяжёлый люкс<\/em><\/h3>\n    <p>Уникальный феномен: тётка из глубинки, которая есть у каждого человека и которую забыли пригласить, но она добралась! От души душевно поздравит и впишется в любой момент на любом мероприятии — естественно, с гостинцами и максимально «зашкварными» историями и конкурсами!<\/p><\/div>\n    <div class=\"ph\" data-show=\"zina\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3265-3135-4138-a661-633262633065/-/resize/700x/IMG_5690.JPG\" data-full=\"https://static.tildacdn.info/tild3265-3135-4138-a66 а.<\/p>\n      <\/div>\n      <div class=\"cta\"><a class=\"btn\" href=\"#cx-contact\">Связаться со мной<\/a><a class=\"tl-link\" href=\"#cx-looks\">Смотреть образы<\/a><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"scrollcue\">Листайте<\/div>\n<\/section>\n\n<section class=\"statement\" id=\"cx-about\"><div class=\"wrap\">\n  <div class=\"eyebrow\">Обо мне<\/div>\n  <p class=\"big\" id=\"cx-big\">Живу <em>праздником<\/em> уже 20 лет. У меня профессиональное образование, и я знаю, о чём говорю: окончила театральное училище и стала дипломированным специалистом — режиссёр театрализованных представлений и праздников (СПбГУКИ).<\/p>\n  <div class=\"tour\">Гастролирую <b>Москва<\/b><b>Сочи<\/b><b>Турция<\/b><b>Баку<\/b><\/div>\n<\/div><\/section>\n\n<section class=\"services\"><div class=\"wrap\">\n  <ul class=\"svc\">\n    <li class=\"rv\"><i>01<\/i>Ведущая на любой праздник<\/li>\n    <li class=\"rv\"><i>02<\/i>Актриса с театрализованной программой<\/li>\n    <li class=\"rv\"><i>03<\/i>Тематические розыгрыши и перфомансы<\/li>\n    <li class=\"rv\"><i>04<\/i>Экспресс-поздравления близким и друзьям<\/li>\n    <li class=\"rv\"><i>05<\/i>Яркий welcome, где сделаем необычные фото для ваших соцсетей<\/li>\n    <li class=\"rv\"><i>06<\/i>Календарные праздники, мальчишники и девичники, свадьбы и корпоративы<\/li>\n  <\/ul>\n<\/div><\/section>\n\n<section class=\"stats\"><div class=\"wrap\">\n  <div class=\"stat rv\"><b><span data-count=\"15\">15<\/span><sup>+<\/sup><\/b><p>лет в сфере создания праздников<\/p><\/div>\n  <div class=\"stat rv\"><b><span data-count=\"1000\">1000<\/span><sup>+<\/sup><\/b><p>реализованных проектов с оригинальной концепцией<\/p><\/div>\n  <div class=\"stat t rv\"><b>Настоящее шоу<\/b><p>Незабываемые впечатления для каждого гостя от настоящих артистов на празднике любого формата.<\/p><\/div>\n<\/div><\/section>\n\n<section class=\"prog\"><div class=\"wrap\">\n  <div class=\"hd rv\"><div class=\"eyebrow\">Программы<\/div><h2>Какие образы чаще всего <em>выбирают?<\/em><\/h2><\/div>\n\n  <article class=\"pcard\"><div class=\"txt\"><div><div class=\"no\">№ 1<span>Пионеры<\/span><\/div><h3>Пионерская <em>вечеринка<\/em><\/h3>\n    <div class=\"q\">«Ни шагу назад, ни шагу на месте, а только вперёд, и только всем вместе!»<\/div>\n    <p>К танцам, песням и веселью будь готов — всегда готов! Если вы относите себя к числу незаурядных личностей, любите нестандартные решения и настоящее веселье — «Пионерская вечеринка» произведёт неизгладимое впечатление на гостей и надолго останется в вашей памяти.<\/p><\/div><\/div>\n    <div class=\"ph\" data-show=\"pioneers\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3033-6534-4537-a366-393963323037/-/resize/700x/IMG_5657.JPG\" data-full=\"https://static.tildacdn.info/tild3033-6534-4537-a366-393963323037/-/resize/1600x/IMG_5657.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3264-3636-4132-b162-333536323861/-/resize/700x/IMG_5660.JPG\" data-full=\"https://static.tildacdn.info/tild3264-3636-4132-b162-333536323861/-/resize/1600x/IMG_5660.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3331-3463-4261-b832-643833373234/-/resize/700x/IMG_5658.JPG\" data-full=\"https://static.tildacdn.info/tild3331-3463-4261-b832-643833373234/-/resize/1600x/IMG_5658.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3363-6366-4565-a439-626664373736/-/resize/700x/photo_52896730807356.jpg\" data-full=\"https://static.tildacdn.info/tild3363-6366-4565-a439-626664373736/-/resize/1600x/photo_52896730807356.jpg\"><\/div><\/article>\n\n  <article class=\"pcard\"><div class=\"txt\"><div><div class=\"no\">№ 2<span>Фольклор<\/span><\/div><h3><em>Аля<\/em> Русь<\/h3>\n    <p>Праздничная программа, которая обыграет популярные мотивы и клише русского фольклора. Ловко жонглирую скалкой и микрофоном, поём песни и танцуем под живой баян.<\/p><\/div><\/div>\n    <div class=\"ph\" data-show=\"alyarus\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3134-3165-4331-b265-636162616133/-/resize/700x/5208791794215675604.jpg\" data-full=\"https://static.tildacdn.info/tild3134-3165-4331-b265-636162616133/-/resize/1600x/5208791794215675604.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3263-6531-4133-a231-333838643839/-/resize/700x/IMG_5671.JPG\" data-full=\"https://static.tildacdn.info/tild3263-6531-4133-a231-333838643839/-/resize/1600x/IMG_5671.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3265-3032-4264-a530-343032393537/-/resize/700x/IMG_5664.JPG\" data-full=\"https://static.tildacdn.info/tild3265-3032-4264-a530-343032393537/-/resize/1600x/IMG_5664.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3664-3533-4136-b932-643730633338/-/resize/700x/5208791794215674606.jpg\" data-full=\"https://static.tildacdn.info/tild3664-3533-4136-b932-643730633338/-/resize/1600x/5208791794215674606.jpg\"><\/div><\/article>\n\n  <article class=\"pcard\"><div class=\"txt\"><div><div class=\"no\">№ 3<span>Корпоратив<\/span><\/div><h3>Вечеринка в стиле <em>90-х<\/em><\/h3>\n    <p>Мероприятие, на котором можно погрузиться в атмосферу свободы, евродэнса и лосин, отдохнуть, вспомнить прошлые года и просто невероятно провести время. Тематические песни, танцы, конкурсы и другие части программы помогут словно на машине времени вернуться в 90-е.<\/p><\/div><\/div>\n    <div class=\"ph\" data-show=\"nineties\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3162-3130-4233-a536-326332393965/-/resize/700x/photo_52896730807356.jpg\" data-full=\"https://static.tildacdn.info/tild3162-3130-4233-a536-326332393965/-/resize/1600x/photo_52896730807356.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3230-6332-4365-b464-623666303739/-/resize/700x/IMG_5614.JPG\" data-full=\"https://static.tildacdn.info/tild3230-6332-4365-b464-623666303739/-/resize/1600x/IMG_5614.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3266-6136-4734-b534-306262646333/-/resize/700x/IMG_5609.JPG\" data-full=\"https://static.tildacdn.info/tild3266-6136-4734-b534-306262646333/-/resize/1600x/IMG_5609.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3965-3762-4061-a635-356336646134/-/resize/700x/IMG_5618.JPG\" data-full=\"https://static.tildacdn.info/tild3965-3762-4061-a635-356336646134/-/resize/1600x/IMG_5618.JPG\"><\/div><\/article>\n\n  <article class=\"pcard\"><div class=\"txt\"><div><div class=\"no\">№ 4<span>Интерактив<\/span><\/div><h3>Тётя Зина — <em>тяжёлый люкс<\/em><\/h3>\n    <p>Уникальный феномен: тётка из глубинки, которая есть у каждого человека и которую забыли пригласить, но она добралась! От души душевно поздравит и впишется в любой момент на любом мероприятии — естественно, с гостинцами и максимально «зашкварными» историями и конкурсами!<\/p><\/div><\/div>\n    <div class=\"ph\" data-show=\"zina\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3265-3135-4138-a661-633262633065/-/resize/700x/IMG_5690.JPG\" data-full=\"https://static.tildacdn.info/tild3265-3135-4138-a661-633262633065/-/resize/1600x/IMG_5690.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3661-3137-4938-a436-356337636333/-/resize/700x/IMG_5691.JPG\" data-full=\"https://static.tildacdn.info/tild3661-3137-4938-a436-356337636333/-/resize/1600x/IMG_5691.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3937-6233-4236-a437-666332633034/-/resize/700x/IMG_5692.JPG\" data-full=\"https://static.tildacdn.info/tild3937-6233-4236-a437-666332633034/-/resize/1600x/IMG_5692.JPG\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild6536-3331-4232-b636-316139356563/-/resize/700x/IMG_5689.JPG\" data-full=\"https://static.tildacdn.info/tild6536-3331-4232-b636-316139356563/-/resize/1600x/IMG_5689.JPG\"><\/div><\/article>\n\n  <article class=\"pcard\"><div class=\"txt\"><div><div class=\"no\">№ 5<span>Юмор<\/span><\/div><h3>Потомственная <em>ведунья<\/em><\/h3>\n    <p>Интерактивная юмористическая программа, подходящая для любого события. Снимаю порчу, возвращаю денежный поток, соединяю судьбы, ставлю защиты на все 7 поколений.<\/p><\/div><\/div>\n    <div class=\"ph\" data-show=\"veduna\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3530-3038-4638-b663-353834366363/-/resize/700x/5208791794215674458.jpg\" data-full=\"https://static.tildacdn.info/tild3530-3038-4638-b663-353834366363/-/resize/1600x/5208791794215674458.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild3539-3438-4363-b831-326132373239/-/resize/700x/5208791794215674246.jpg\" data-full=\"https://static.tildacdn.info/tild3539-3438-4363-b831-326132373239/-/resize/1600x/5208791794215674246.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild6236-3031-4665-b162-626538363833/-/resize/700x/5208791794215675838.jpg\" data-full=\"https://static.tildacdn.info/tild6236-3031-4665-b162-626538363833/-/resize/1600x/5208791794215675838.jpg\"><img loading=\"lazy\" alt=\"\" src=\"https://static.tildacdn.info/tild6337-6439-4361-a139-623061353639/-/resize/700x/5208791794215674585.jpg\" data-full=\"https://static.tildacdn.info/tild6337-6439-4361-a139-623061353639/-/resize/1600x/5208791794215674585.jpg\"><\/div><\/article>\n<\/div><\/section>\n\n<section class=\"looks\" id=\"cx-looks\">\n  <div class=\"wrap\"><div class=\"hd rv\"><div class=\"eyebrow\">Образы<\/div><h2>Готовые <em>образы<\/em><\/h2><p>Не нашли своего? Создам образ под ваш запрос.<\/p><\/div><\/div>\n  <div class=\"lwrap\">\n    <div class=\"lrow a\"><div class=\"trk\" data-looks><span>Тётя Зина<\/span><span>Снегурочка<\/span><span>Морячка<\/span><span>Проводница<\/span><span>Итальянская Дона<\/span><span>Полицейская<\/span><span>Пионерка<\/span><span>Таролог-нумеролог<\/span><span>Буфетчица<\/span><span>Прапорщица<\/span><span>Стюардесса<\/span><span>Екатерина II<\/span><span>Солоха<\/span><span>Цыганка<\/span><span>Роза<\/span><span>Ясновидящая гадалка<\/span><span>Челночница из 90-х<\/span><span>Бородатая женщина<\/span><span>Викинг<\/span><span>Тамада<\/span><span>Стимпанк<\/span><span>Кассир<\/span><span>Ковбойша<\/span><span>Врач<\/span><span>Невеста<\/span><span>Крановщица<\/span><span>Рокерша<\/span><span>Ведьма<\/span><span>Русская красавица<\/span><span>Бабка-сплетница с лавки<\/span><\/div><\/div>\n    <div class=\"lrow b\"><div class=\"trk\" data-looks><span>Тётя Зина<\/span><span>Снегурочка<\/span><span>Морячка<\/span><span>Проводница<\/span><span>Итальянская Дона<\/span><span>Полицейская<\/span><span>Пионерка<\/span><span>Таролог-нумеролог<\/span><span>Буфетчица<\/span><span>Прапорщица<\/span><span>Стюардесса<\/span><span>Екатерина II<\/span><span>Солоха<\/span><span>Цыганка<\/span><span>Роза<\/span><span>Ясновидящая гадалка<\/span><span>Челночница из 90-х<\/span><span>Бородатая женщина<\/span><span>Викинг<\/span><span>Тамада<\/span><span>Стимпанк<\/span><span>Кассир<\/span><span>Ковбойша<\/span><span>Врач<\/span><span>Невеста<\/span><span>Крановщица<\/span><span>Рокерша<\/span><span>Ведьма<\/span><span>Русская красавица<\/span><span>Бабка-сплетница с лавки<\/span><\/div><\/div>\n  <\/div>\n  <div class=\"wrap\"><div class=\"cta rv\"><a class=\"btn\" href=\"#cx-contact\">Связаться со мной<\/a><\/div><\/div>\n<\/section>\n\n<section class=\"how\" id=\"cx-how\"><div class=\"wrap\">\n  <div class=\"hd rv\"><div><div class=\"eyebrow\">Как это работает<\/div><h2>Механика <em>работы<\/em><\/h2><\/div>\n    <p>Индивидуальный подход к каждому событию: пишу индивидуальный сценарий и создаю тематические образы и внешний вид под каждый праздник.<\/p><\/div>\n  <div class=\"tl\" id=\"cx-tl\"><div class=\"fill\" id=\"cx-fill\"><\/div>\n    <div class=\"st\"><div class=\"b rv\"><div class=\"n\">Шаг I<\/div><h3>Обсуждение деталей<\/h3><ul><li>обсуждение концепции<\/li><li>возможно написание сценария
