<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Елена Голливудова — варианты дизайна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0d12;--panel:#17151d;--line:rgba(255,255,255,.1);--ink:#f2ece0;--mute:#9c95a6;--gold:#f2c14e;--gold2:#fff1c1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
body::before{content:"";position:fixed;top:-300px;right:-200px;width:900px;height:900px;background:radial-gradient(circle,rgba(242,193,78,.13),transparent 62%);pointer-events:none}
header{position:relative;z-index:5;padding:22px 28px 0;display:flex;flex-wrap:wrap;align-items:center;gap:14px 32px}
.brand .k{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:700}
.brand h1{font-family:'Playfair Display',serif;font-weight:900;font-size:30px;line-height:1.1;color:var(--gold)}
.sp{flex:1}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:9px 18px;border-radius:99px;font-weight:700;font-size:13px;color:var(--mute);transition:.2s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:linear-gradient(120deg,#fff1c1,#f2c14e);color:#1a1204}
.tabs{position:relative;z-index:5;padding:18px 28px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tab{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;transition:.25s}
.tab:hover{border-color:rgba(242,193,78,.5);transform:translateY(-2px)}
.tab.on{border-color:var(--gold);box-shadow:0 12px 40px rgba(242,193,78,.12)}
.tab .t{display:flex;align-items:center;gap:12px;font-weight:800;font-size:15px}
.tab .n{width:26px;height:26px;border-radius:50%;background:#2a2733;display:grid;place-items:center;font-size:12px;color:var(--gold)}
.tab.on .n{background:var(--gold);color:#1a1204}
.tab .sw{display:flex;gap:5px;margin-left:auto}
.tab .sw i{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);display:block}
.tab p{font-size:12.5px;line-height:1.45;color:var(--mute)}
.stage{position:relative;z-index:2;flex:1;padding:18px 28px 10px;display:flex;justify-content:center;align-items:flex-start}
.hint{position:relative;z-index:2;text-align:center;font-size:12px;color:var(--mute);padding:0 20px 14px}
.browser{background:#1d1b24;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.55);display:flex;flex-direction:column}
.browser .bar{height:38px;flex:0 0 38px;display:flex;align-items:center;gap:7px;padding:0 14px;background:#232029;border-bottom:1px solid var(--line)}
.browser .bar i{width:11px;height:11px;border-radius:50%;display:block}
.browser .bar i:nth-child(1){background:#ff5f57}.browser .bar i:nth-child(2){background:#febc2e}.browser .bar i:nth-child(3){background:#28c840}
.browser .url{margin-left:14px;flex:1;max-width:420px;height:22px;border-radius:99px;background:#15131a;color:var(--mute);font-size:11px;display:flex;align-items:center;padding:0 14px}
.viewport{position:relative;overflow:hidden;flex:1;background:#fff}
.viewport iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
.phones{display:flex;justify-content:center;align-items:flex-start}
.phone{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:12px}
.phone .lab{font-weight:800;font-size:14px}
.bezel{background:#0a0a0d;border-radius:46px;padding:12px;border:2px solid #34313d;box-shadow:0 30px 80px rgba(0,0,0,.6);position:relative}
.bezel::before{content:"";position:absolute;top:19px;left:50%;width:84px;height:22px;border-radius:99px;background:#0a0a0d;transform:translateX(-50%);z-index:3;pointer-events:none}
.scr{border-radius:36px;overflow:hidden;position:relative;background:#fff}
.scr iframe{position:absolute;left:0;top:0;border:0;background:#fff}
.mbtn{display:none}
@media(max-width:900px){
  header{padding:10px 14px;flex-wrap:wrap;gap:8px 12px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line)}
  .brand .k{display:none}.brand h1{font-size:20px}
  .mbtn{display:inline-flex;all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid var(--line);border-radius:99px;font-size:13px;font-weight:700;color:var(--ink);background:var(--panel)}
  .mbtn::after{content:'';width:7px;height:7px;border-right:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);transform:rotate(45deg) translateY(-2px);transition:.25s}
  body.menu-open .mbtn::after{transform:rotate(-135deg) translateY(-2px)}
  .sp{display:none}.brand{flex:1}
  .seg{display:none;order:3;width:100%;justify-content:space-between}.seg button{flex:1;justify-content:center;text-align:center;padding:9px 6px;font-size:12px}
  .tabs{display:none;padding:8px 14px 0;grid-template-columns:1fr;gap:6px}.tab{padding:11px 14px}.tab p{display:none}
  body.menu-open .seg{display:flex}body.menu-open .tabs{display:grid}
  .stage{padding:10px 10px 6px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="k">Редизайн сайта · Tilda</div><h1>Елена Голливудова</h1></div>
  <div class="sp"></div><button class="mbtn" id="mbtn" type="button">Меню</button>
  <div class="seg" id="modes">
    <button data-m="desktop" class="on">Десктоп</button>
    <button data-m="mobile">Телефон</button>
    <button data-m="compare">Рядом: 4 лучших</button>
  </div>
</header>
<div class="tabs" id="tabs"></div>
<div class="stage" id="stage"></div>
<div class="hint" id="hint"></div>

<script>
var DOCS = ["kinetic.html", "bento.html", "magazine.html", "champagne.html", "bordeaux.html", "kino.html", "mono.html", "premium.html"];
var V = [
  {name:'Кинетика', sw:['#07070a','#d6ff3f','#f2f1ec','#8d8d93'], d:'Смелая моушен-анимация: прелоадер, гигантские буквы, которые реагируют на курсор, горизонтальный проход по программам, магнитные кнопки.'},
  {name:'Бенто', sw:['#ecebe7','#0e0e11','#4f46ff','#ff7a59'], d:'Современный интерфейс: плитки с подсветкой под курсором, наклон фото, бегущий ticker образов, «случайный образ», тёмная заявка.'},
  {name:'Обложка', sw:['#f4eee3','#121212','#b0212b','#6f6a62'], d:'Журнал: Елена на обложке, «спецпроект» программ, гардероб образов, письма читателей. Самая запоминающаяся идея.'},
  {name:'Шампань', sw:['#fffdfa','#f6e9e4','#c9ad82','#5a4338'], d:'Светлый люкс для свадеб и дней рождения: арки, нежные тона, программы во вкладках, заявка за минуту.'},
  {name:'Бордо', sw:['#3a0b17','#f7f0e6','#c2a36a','#661a2d'], d:'Продающий: глубокий бордо и шампань, карусель программ с кнопкой «хочу такую», заявка за минуту в WhatsApp.'},
  {name:'Кино', sw:['#0b0a09','#efe9dc','#c8a96b','#8e7448'], d:'Кинематографичная подача: огромная типографика, эффекты при прокрутке, карточки-программы, галерея с параллаксом.'},
  {name:'Моно', sw:['#0b0b0b','#f3f2ee','#ff4122','#85847f'], d:'Дерзкий модный журнал: чёрно-белые фото, огромные заголовки, один красный акцент, программы-аккордеон.'},
  {name:'Премиум', sw:['#f3eee5','#131110','#a8844f','#cdb083'], d:'Сдержанная журнальная подача: слоновая кость и графит, тонкий шрифт, крупные фото, воздух.'}
];
var st = {v:0, m: innerWidth<900 ? 'mobile' : 'desktop'};
var $ = function(id){return document.getElementById(id)};
function tabs(){
  $('tabs').innerHTML = V.map(function(x,i){
    return '<button class="tab'+(i===st.v?' on':'')+'" data-i="'+i+'"><div class="t"><span class="n">'+(i+1)+'</span>'+x.name+'<span class="sw">'+x.sw.map(function(c){return '<i style="background:'+c+'"></i>'}).join('')+'</span></div><p>'+x.d+'</p></button>';
  }).join('');
  $('tabs').style.display = st.m==='compare' ? 'none' : '';
}
function mkIframe(i){ var f=document.createElement('iframe'); var d=DOCS[i]; if(/^[\w\-\/\.]+\.html$/.test(d)) f.src=d; else f.srcdoc=d; return f; }
function phone(i,h){
  var p=document.createElement('div'); p.className='phone';
  p.innerHTML='<div class="lab">'+(i+1)+'. '+V[i].name+'</div><div class="bezel"><div class="scr" style="width:390px;height:'+h+'px"></div></div>';
  var f=mkIframe(i); f.style.width='390px'; f.style.height=h+'px'; p.querySelector('.scr').appendChild(f);
  return p;
}
function render(){
  tabs();
  [].forEach.call($('modes').children,function(b){b.classList.toggle('on',b.dataset.m===st.m)});
  var stage=$('stage'); stage.innerHTML='';
  var availH = Math.max(420, innerHeight - stage.getBoundingClientRect().top - 50);
  var availW = stage.clientWidth - (innerWidth<900?24:56);
  if(st.m==='desktop'){
    var s = Math.min(1, availW/1280), w = Math.round(1280*s);
    var b = document.createElement('div'); b.className='browser'; b.style.width=w+'px'; b.style.height=availH+'px';
    b.innerHTML='<div class="bar"><i></i><i></i><i></i><div class="url">Предпросмотр · '+V[st.v].name+' · десктоп</div></div><div class="viewport"></div>';
    stage.appendChild(b);
    var f=mkIframe(st.v); f.style.width='1280px'; f.style.height=Math.ceil((availH-38)/s)+'px'; f.style.transform='scale('+s+')';
    b.querySelector('.viewport').appendChild(f);
    $('hint').textContent='Страница живая: листайте, наводите курсор, нажимайте на фото.';
  } else if(st.m==='mobile'){
    if(innerWidth<900){
      var g=mkIframe(st.v); g.style.cssText='width:100%;height:'+(availH+20)+'px;border:0;border-radius:18px;background:#fff';
      stage.appendChild(g);
    } else {
      stage.appendChild(phone(st.v, Math.max(480, Math.min(844, availH-40))));
    }
    $('hint').textContent='Мобильная версия (ширина 390 px): листайте внутри телефона.';
  } else {
    var gap=34, pw=414, total=4*pw+3*gap, H=Math.max(480, Math.min(844, availH-60));
    var s2=Math.min(1, availW/total);
    var wrap=document.createElement('div'); wrap.className='phones'; wrap.style.cssText='gap:'+gap+'px;position:absolute;left:0;top:0;width:'+total+'px;transform-origin:0 0;transform:scale('+s2+')';
    for(var i=0;i<4;i++) wrap.appendChild(phone(i,H));
    var box=document.createElement('div'); box.style.cssText='position:relative;width:'+Math.round(total*s2)+'px;height:'+Math.round((H+24+34)*s2)+'px';
    box.appendChild(wrap); stage.appendChild(box);
    $('hint').textContent='Четыре лучших варианта рядом на телефоне. Каждый экран можно листать отдельно.';
  }
}
document.addEventListener('click',function(e){
  var mb=e.target.closest('#mbtn'); if(mb){document.body.classList.toggle('menu-open');setTimeout(render,0);return}
  var t=e.target.closest('.tab'); if(t){st.v=+t.dataset.i;document.body.classList.remove('menu-open');render();return}
  var m=e.target.closest('#modes button'); if(m){st.m=m.dataset.m;document.body.classList.remove('menu-open');render()}
});
var rt; addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(render,200)});
render();
</script>
</body>
</html>
